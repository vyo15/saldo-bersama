name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: npm
      - name: Check changed whitespace
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_SHA" ]; then
            git diff --check "$BASE_SHA"...HEAD
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git diff --check "$BEFORE_SHA" HEAD
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff --check
          fi
      - run: npm ci
      - name: Run canonical verification
        env:
          VITE_GOOGLE_CLIENT_ID: ci-quality.apps.googleusercontent.com
          VITE_FIREBASE_API_KEY: ci-quality-public-key
          VITE_FIREBASE_AUTH_DOMAIN: saldo-bersama.firebaseapp.com
        run: npm run verify
      - name: Duplication report (non-blocking)
        continue-on-error: true
        run: npx --yes jscpd@4.2.5 --config .jscpd.json api frontend/src scripts test
      - name: Verify clean source archive
        run: node scripts/create-clean-archive.mjs "$RUNNER_TEMP/saldo-bersama-clean.zip"
