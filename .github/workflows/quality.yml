name: Quality

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/SB-*'
      - 'fix/SB-*'
      - 'security/SB-*'
      - 'perf/SB-*'
      - 'docs/SB-*'
      - 'test/SB-*'
      - 'chore/SB-*'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run project checks
        env:
          TASK_BRANCH: ${{ github.event_name == 'push' && github.ref_name != 'main' && github.ref_name || '' }}
          TASK_BASE_REF: ${{ github.event_name == 'push' && github.ref_name != 'main' && 'origin/main' || '' }}
          VITE_GOOGLE_CLIENT_ID: ci-browser-smoke.apps.googleusercontent.com
          VITE_FIREBASE_API_KEY: ci-browser-smoke-public-key
        run: npm run check
      - name: Guarded mutation regression
        run: npm run test:guard
      - name: Duplication report (non-blocking)
        continue-on-error: true
        run: npm run check:duplicates
      - name: Browser smoke and human-error journey
        timeout-minutes: 3
        run: npm run test:browser
      - name: Verify clean source archive
        run: npm run zip -- "$RUNNER_TEMP/saldo-bersama-clean.zip"
