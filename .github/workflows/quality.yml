name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".node-version"
          cache: npm
      - run: npm ci
      - name: Run project checks
        env:
          VITE_GOOGLE_CLIENT_ID: ci-browser-smoke.apps.googleusercontent.com
          VITE_FIREBASE_API_KEY: ci-browser-smoke-public-key
          VITE_FIREBASE_AUTH_DOMAIN: saldo-bersama.firebaseapp.com
        run: npm run check
      - name: Guarded mutation regression
        run: npm run test:guard
      - name: Duplication report (non-blocking)
        continue-on-error: true
        run: npm run check:duplicates
      - name: Browser smoke and human-error journey
        timeout-minutes: 3
        run: npm run test:browser
      - name: Verify clean source archive
        run: node scripts/create-clean-archive.mjs "$RUNNER_TEMP/saldo-bersama-clean.zip"
